<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Viaturas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom right, #f8fafc, #f1f5f9);
            color: #1a2540;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(to right, #0c1f3e, #1a3a6e, #142f5e);
            color: white;
            padding: 20px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 4px solid #f59e0b;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-sub {
            font-size: 10px;
            color: #fbbf24;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative;
                top: 0;
            }
        }

        .sidebar {
            position: sticky;
            top: 24px;
            height: fit-content;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .card-header {
            background: linear-gradient(to right, #1a56db, #1e40af);
            color: white;
            padding: 14px 20px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .btn-group {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .btn {
                flex: 1 1 calc(50% - 10px);
                text-align: center;
                justify-content: center;
            }
        }

        .btn {
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-active {
            background: #1e40af;
            color: white;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group input:read-only {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .checklist-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item:hover {
            background: #f8fafc;
        }

        .item-name {
            font-weight: 500;
            font-size: 14px;
            color: #334155;
            flex: 1;
            min-width: 200px;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            width: auto;
        }

        @media (max-width: 640px) {
            .item-controls {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }
            .status-select {
                width: 100% !important;
            }
        }

        .status-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            text-align: center;
            width: 120px;
            transition: all 0.2s;
        }

        .status-ok { background: #dcfce7; color: #166534; border-color: #86efac; }
        .status-atencao { background: #fef9c3; color: #713f12; border-color: #fde047; }
        .status-avaria { background: #fee2e2; color: #7f1d1d; border-color: #fca5a5; }
        .status-inspecao { background: #dbeafe; color: #1e3a8a; border-color: #93c5fd; }
        .status-avaliacao { background: #ede9fe; color: #4c1d95; border-color: #c4b5fd; }
        .status-na { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }

        .obs-input {
            padding: 8px 12px;
            font-size: 12px;
            min-width: 150px;
        }

        .section-header {
            background: #f8fafc;
            color: #475569;
            padding: 12px 20px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #3b82f6;
            border-radius: 2px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 32px;
            position: sticky;
            bottom: 24px;
            z-index: 50;
        }

        .btn-pdf {
            background: #ef4444;
            color: white;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
        }

        .btn-pdf:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(239, 68, 68, 0.4);
        }

        .btn-reset {
            background: #94a3b8;
            color: white;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #64748b;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.success { background: #10b981; color: white; }
        .toast.error { background: #ef4444; color: white; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-title">Checklist de Viaturas</div>
            <div class="header-sub">Gestão e Controle de Frota</div>
        </div>
    </header>

    <div class="container">
        <div class="grid">
            <div class="sidebar">
                <div class="card">
                    <div class="card-header">Tipo de Inspeção</div>
                    <div class="card-body">
                        <div class="btn-group">
                            <button class="btn btn-active" onclick="switchChecklist('cavalo')">🚛 Cavalo Mecânico</button>
                            <button class="btn btn-secondary" onclick="switchChecklist('carga')">📦 Carga Seca</button>
                            <button class="btn btn-secondary" onclick="switchChecklist('bau')">🚚 Caminhão Baú</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="main-content"></div>
        </div>
    </div>

    <script>
        const CAVALO_ITEMS = [
            { id: 'limpeza', name: 'Limpeza interna da cabine', category: '1. PARTE INTERNA' },
            { id: 'tapetes', name: 'Tapetes', category: '1. PARTE INTERNA' },
            { id: 'bancos', name: 'Bancos (estado e fixação)', category: '1. PARTE INTERNA' },
            { id: 'cintos', name: 'Cintos de segurança', category: '1. PARTE INTERNA' },
            { id: 'extintor', name: 'Extintor de incêndio (validade/pressão)', category: '1. PARTE INTERNA' },
            { id: 'triangulo', name: 'Triângulo, macaco e chave de roda', category: '1. PARTE INTERNA' },
            { id: 'ar', name: 'Ar condicionado / Ventilação', category: '1. PARTE INTERNA' },
            { id: 'vidros', name: 'Vidros e travas elétricas', category: '1. PARTE INTERNA' },
            { id: 'espelhos', name: 'Espelhos retrovisores internos', category: '1. PARTE INTERNA' },
            { id: 'tacografo', name: 'Tacógrafo (disco/fita e hora)', category: 'Instrumentos do Painel' },
            { id: 'luzes_painel', name: 'Luzes de advertência (painel)', category: 'Instrumentos do Painel' },
            { id: 'combustivel', name: 'Marcador de combustível', category: 'Instrumentos do Painel' },
            { id: 'temperatura', name: 'Marcador de temperatura', category: 'Instrumentos do Painel' },
            { id: 'pressao_ar', name: 'Pressão do ar (manômetros)', category: 'Instrumentos do Painel' },
            { id: 'buzina', name: 'Buzina', category: 'Instrumentos do Painel' },
            { id: 'limpador', name: 'Limpador e lavador de parabrisa', category: 'Instrumentos do Painel' },
            { id: 'farol_baixo', name: 'Faróis (alto/baixo)', category: '2. PARTE EXTERNA' },
            { id: 'lanternas', name: 'Lanternas dianteiras/traseiras', category: '2. PARTE EXTERNA' },
            { id: 'luz_freio', name: 'Luz de freio', category: '2. PARTE EXTERNA' },
            { id: 'luz_re', name: 'Luz de ré', category: '2. PARTE EXTERNA' },
            { id: 'setas', name: 'Setas (pisca-alerta)', category: '2. PARTE EXTERNA' },
            { id: 'luz_placa', name: 'Luzes de placa', category: '2. PARTE EXTERNA' },
            { id: 'pneus_dianteiros', name: 'Estado dos pneus (dianteiros)', category: '2. PARTE EXTERNA' },
            { id: 'pneus_tracao', name: 'Estado dos pneus (tração)', category: '2. PARTE EXTERNA' },
            { id: 'pneus_truck', name: 'Estado dos pneus (truck)', category: '2. PARTE EXTERNA' },
            { id: 'estepe', name: 'Estepe (estado e calibragem)', category: '2. PARTE EXTERNA' },
            { id: 'oleo_motor', name: 'Nível de óleo do motor', category: '2. PARTE EXTERNA' },
            { id: 'arrefecimento', name: 'Nível do líquido de arrefecimento', category: '2. PARTE EXTERNA' },
            { id: 'embreagem', name: 'Nível de fluído de embreagem', category: '2. PARTE EXTERNA' },
            { id: 'vazamentos', name: 'Vazamentos visíveis (óleo/água/ar)', category: '2. PARTE EXTERNA' },
            { id: 'parachoque', name: 'Parachoque dianteiro', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'grade', name: 'Grade frontal', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'paralamas', name: 'Paralamas', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'portas', name: 'Portas e maçanetas', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'escadas', name: 'Escadas de acesso', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'defletores', name: 'Defletores de ar', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'pintura', name: 'Estado da pintura geral', category: 'Funilaria & Pintura (Cavalo)' },
            { id: 'capacete', name: 'Capacete', category: '3. EQUIPAMENTOS DE PROTEÇÃO INDIVIDUAL (EPIs)' },
            { id: 'luvas', name: 'Luvas de vaqueta/raspa', category: '3. EQUIPAMENTOS DE PROTEÇÃO INDIVIDUAL (EPIs)' },
            { id: 'botina', name: 'Botina de segurança', category: '3. EQUIPAMENTOS DE PROTEÇÃO INDIVIDUAL (EPIs)' },
            { id: 'protetor_auricular', name: 'Protetor auricular', category: '3. EQUIPAMENTOS DE PROTEÇÃO INDIVIDUAL (EPIs)' },
        ];

        const CHECKLIST_ITEMS = {
            cavalo: [...CAVALO_ITEMS],
            carga: [
                ...CAVALO_ITEMS,
                { id: 'assoalho', name: 'Assoalho da carroceria', category: '4. CARGA SECA' },
                { id: 'grades', name: 'Grades laterais e traseira', category: '4. CARGA SECA' },
                { id: 'travas', name: 'Travas das grades', category: '4. CARGA SECA' },
                { id: 'arcos', name: 'Arcos e lona (se houver)', category: '4. CARGA SECA' },
                { id: 'cordas', name: 'Cordas e cintas de amarração', category: '4. CARGA SECA' },
                { id: 'protetores', name: 'Protetores laterais', category: '4. CARGA SECA' },
                { id: 'faixas_refletivas', name: 'Faixas refletivas', category: '4. CARGA SECA' },
            ],
            bau: [
                ...CAVALO_ITEMS,
                { id: 'portas_bau', name: 'Portas traseiras e trincos', category: '5. CAMINHÃO BAÚ' },
                { id: 'porta_lateral', name: 'Porta lateral (se houver)', category: '5. CAMINHÃO BAÚ' },
                { id: 'vedacao', name: 'Vedação contra chuva (borrachas)', category: '5. CAMINHÃO BAÚ' },
                { id: 'iluminacao', name: 'Iluminação interna do baú', category: '5. CAMINHÃO BAÚ' },
                { id: 'assoalho_bau', name: 'Assoalho interno (integridade)', category: '5. CAMINHÃO BAÚ' },
                { id: 'paredes', name: 'Paredes internas (revestimento)', category: '5. CAMINHÃO BAÚ' },
                { id: 'teto_bau', name: 'Teto (integridade e furos)', category: '5. CAMINHÃO BAÚ' },
                { id: 'escada_bau', name: 'Escada de acesso ao baú', category: '5. CAMINHÃO BAÚ' },
                { id: 'faixas_bau', name: 'Faixas refletivas (laterais e traseiras)', category: '5. CAMINHÃO BAÚ' },
                { id: 'parachoque_bau', name: 'Para-choque traseiro', category: '5. CAMINHÃO BAÚ' },
                { id: 'paralamas_bau', name: 'Para-lamas traseiros', category: '5. CAMINHÃO BAÚ' },
                { id: 'protetor_ciclista', name: 'Protetores laterais (ciclista)', category: '5. CAMINHÃO BAÚ' },
                { id: 'pneus_implemento', name: 'Estado dos pneus do implemento', category: '5. CAMINHÃO BAÚ' },
                { id: 'placa_bau', name: 'Placa de identificação e lacre', category: '5. CAMINHÃO BAÚ' },
                { id: 'trilhos_fixacao', name: 'Trilhos internos de fixação de carga', category: '5. CAMINHÃO BAÚ' },
                { id: 'cintas_cordas', name: 'Cintas e cordas de amarração', category: '5. CAMINHÃO BAÚ' },
                { id: 'sinalizacao_sup', name: 'Sinalização superior (delimitadoras)', category: '5. CAMINHÃO BAÚ' },
                { id: 'pintura_externa', name: 'Estado da pintura/adesivagem externa', category: '5. CAMINHÃO BAÚ' },
            ],
        };

        let currentType = 'cavalo';
        const TYPE_LABELS = {
            cavalo: 'Cavalo Mecânico',
            carga: 'Carga Seca',
            bau: 'Caminhão Baú'
        };

        let formData = {
            cavalo: { cavaloMecanico: '', quilometragem: '', motorista: '', data: new Date().toISOString().split('T')[0], panes: '', reposicao: '', items: {} },
            carga: { cavaloMecanico: '', quilometragem: '', motorista: '', data: new Date().toISOString().split('T')[0], panes: '', reposicao: '', items: {} },
            bau: { cavaloMecanico: '', quilometragem: '', motorista: '', data: new Date().toISOString().split('T')[0], panes: '', reposicao: '', items: {} },
        };

        function initializeItems() {
            Object.keys(CHECKLIST_ITEMS).forEach(type => {
                CHECKLIST_ITEMS[type].forEach(item => {
                    if (!formData[type].items[item.id]) {
                        formData[type].items[item.id] = { status: 'N/A', obs: '' };
                    }
                });
            });
        }
        initializeItems();

        function switchChecklist(type) {
            currentType = type;
            document.querySelectorAll('.btn-group .btn').forEach((btn) => {
                btn.classList.remove('btn-active');
                btn.classList.add('btn-secondary');
            });
            
            const buttons = document.querySelectorAll('.btn-group .btn');
            if (type === 'cavalo') buttons[0].classList.replace('btn-secondary', 'btn-active');
            if (type === 'carga') buttons[1].classList.replace('btn-secondary', 'btn-active');
            if (type === 'bau') buttons[2].classList.replace('btn-secondary', 'btn-active');
            
            renderForm();
        }

        function renderForm() {
            const container = document.getElementById('main-content');
            const data = formData[currentType];
            const items = CHECKLIST_ITEMS[currentType];

            const groupedItems = {};
            items.forEach(item => {
                if (!groupedItems[item.category]) groupedItems[item.category] = [];
                groupedItems[item.category].push(item);
            });

            let html = `
                <div class="space-y-6">
                    <div class="card">
                        <div class="card-header">Identificação</div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Tipo de Viatura</label>
                                    <input type="text" id="identificacaoViatura" value="${TYPE_LABELS[currentType]}" readonly>
                                </div>
                                <div class="form-group">
                                    <label>Viatura Prefixo</label>
                                    <input type="text" id="cavaloMecanico" placeholder="Ex: 12DE195" value="${data.cavaloMecanico}">
                                </div>
                                <div class="form-group">
                                    <label>Quilometragem (KM)</label>
                                    <input type="number" id="quilometragem" placeholder="Ex: 256329" value="${data.quilometragem}">
                                </div>
                                <div class="form-group">
                                    <label>Data</label>
                                    <input type="date" id="data" value="${data.data}">
                                </div>
                                <div class="form-group">
                                    <label>Motorista</label>
                                    <input type="text" id="motorista" placeholder="Nome do motorista" value="${data.motorista}">
                                </div>
                            </div>
                        </div>
                    </div>
            `;

            Object.entries(groupedItems).forEach(([category, categoryItems]) => {
                html += `
                    <div class="card">
                        <div class="section-header">${category}</div>
                        <div>
                            ${categoryItems.map(item => `
                                <div class="checklist-item">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-controls">
                                        <select class="status-select status-${data.items[item.id].status.toLowerCase().replace('/', '')}" id="status-${item.id}" onchange="updateItem('${item.id}', 'status', this.value)">
                                            <option value="OK" ${data.items[item.id].status === 'OK' ? 'selected' : ''}>OK</option>
                                            <option value="ATENÇÃO" ${data.items[item.id].status === 'ATENÇÃO' ? 'selected' : ''}>ATENÇÃO</option>
                                            <option value="AVARIA" ${data.items[item.id].status === 'AVARIA' ? 'selected' : ''}>AVARIA</option>
                                            <option value="INSPEÇÃO" ${data.items[item.id].status === 'INSPEÇÃO' ? 'selected' : ''}>INSPEÇÃO</option>
                                            <option value="AVALIAÇÃO" ${data.items[item.id].status === 'AVALIAÇÃO' ? 'selected' : ''}>AVALIAÇÃO</option>
                                            <option value="N/A" ${data.items[item.id].status === 'N/A' ? 'selected' : ''}>N/A</option>
                                        </select>
                                        <input type="text" class="obs-input form-group" style="margin-bottom:0" id="obs-${item.id}" placeholder="Observação..." value="${data.items[item.id].obs}" onchange="updateItem('${item.id}', 'obs', this.value)">
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="card">
                    <div class="section-header" style="color: #ef4444">⚠️ Relatório de Panes</div>
                    <div class="card-body">
                        <textarea id="panes" placeholder="Descreva aqui qualquer pane ou falha observada..." style="min-height: 100px;">${data.panes}</textarea>
                    </div>
                </div>

                <div class="card">
                    <div class="section-header" style="color: #0d9488">🔄 Necessidades de Reposição</div>
                    <div class="card-body">
                        <textarea id="reposicao" placeholder="Ex: Lâmpada de farol, palheta, fusível..." style="min-height: 100px;">${data.reposicao}</textarea>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-pdf" onclick="generatePDF()">📄 Gerar PDF</button>
                    <button class="btn-reset" onclick="resetForm()">🔄 Limpar Tudo</button>
                </div>
            `;

            container.innerHTML = html;

            document.getElementById('cavaloMecanico').addEventListener('input', (e) => { data.cavaloMecanico = e.target.value; });
            document.getElementById('quilometragem').addEventListener('input', (e) => { data.quilometragem = e.target.value; });
            document.getElementById('motorista').addEventListener('input', (e) => { data.motorista = e.target.value; });
            document.getElementById('data').addEventListener('input', (e) => { data.data = e.target.value; });
            document.getElementById('panes').addEventListener('input', (e) => { data.panes = e.target.value; });
            document.getElementById('reposicao').addEventListener('input', (e) => { data.reposicao = e.target.value; });
        }

        function updateItem(itemId, field, value) {
            formData[currentType].items[itemId][field] = value;
            if (field === 'status') {
                const select = document.getElementById(`status-${itemId}`);
                select.className = `status-select status-${value.toLowerCase().replace('/', '')}`;
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function resetForm() {
            if (confirm(`Deseja limpar todos os dados do checklist de ${TYPE_LABELS[currentType]}?`)) {
                const data = formData[currentType];
                data.cavaloMecanico = '';
                data.quilometragem = '';
                data.motorista = '';
                data.data = new Date().toISOString().split('T')[0];
                data.panes = '';
                data.reposicao = '';
                Object.keys(data.items).forEach(key => {
                    data.items[key] = { status: 'N/A', obs: '' };
                });
                renderForm();
                showToast('Checklist reiniciado com sucesso!');
            }
        }

        async function generatePDF() {
            const data = formData[currentType];
            if (!data.cavaloMecanico.trim()) {
                showToast('Por favor, preencha o Prefixo da Viatura', 'error');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                let yPosition = 15;

                doc.setFillColor(12, 31, 62);
                doc.rect(15, yPosition, pageWidth - 30, 20, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(16);
                doc.text('CHECKLIST DE VIATURAS', pageWidth / 2, yPosition + 12, { align: 'center' });
                yPosition += 28;

                doc.setTextColor(12, 31, 62);
                doc.setFontSize(9);
                
                doc.setFont('helvetica', 'bold');
                doc.text('TIPO DE VIATURA:', 15, yPosition);
                doc.setFont('helvetica', 'normal');
                doc.text(TYPE_LABELS[currentType], 50, yPosition);
                
                doc.setFont('helvetica', 'bold');
                doc.text('VIATURA PREFIXO:', pageWidth / 2 + 5, yPosition);
                doc.setFont('helvetica', 'normal');
                doc.text(data.cavaloMecanico || '—', pageWidth / 2 + 45, yPosition);
                
                yPosition += 7;
                doc.setFont('helvetica', 'bold');
                doc.text('QUILOMETRAGEM:', 15, yPosition);
                doc.setFont('helvetica', 'normal');
                doc.text(data.quilometragem ? data.quilometragem + ' KM' : '—', 50, yPosition);
                
                doc.setFont('helvetica', 'bold');
                doc.text('DATA:', pageWidth / 2 + 5, yPosition);
                doc.setFont('helvetica', 'normal');
                doc.text(data.data || '—', pageWidth / 2 + 45, yPosition);
                
                yPosition += 7;
                doc.setFont('helvetica', 'bold');
                doc.text('MOTORISTA:', 15, yPosition);
                doc.setFont('helvetica', 'normal');
                doc.text(data.motorista || '—', 50, yPosition);
                
                yPosition += 12;

                const items = CHECKLIST_ITEMS[currentType];
                const groupedItems = {};
                items.forEach(item => {
                    if (!groupedItems[item.category]) groupedItems[item.category] = [];
                    groupedItems[item.category].push(item);
                });

                const statusColors = {
                    'OK': [22, 101, 52],
                    'ATENÇÃO': [113, 63, 18],
                    'AVARIA': [127, 29, 29],
                    'INSPEÇÃO': [30, 58, 138],
                    'AVALIAÇÃO': [76, 29, 149],
                    'N/A': [71, 85, 105],
                };

                Object.entries(groupedItems).forEach(([category, categoryItems]) => {
                    if (yPosition > pageHeight - 30) {
                        doc.addPage();
                        yPosition = 15;
                    }

                    doc.setFillColor(241, 245, 249);
                    doc.rect(15, yPosition, pageWidth - 30, 6, 'F');
                    doc.setTextColor(71, 85, 105);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8);
                    doc.text(category, 18, yPosition + 4);
                    yPosition += 7;

                    categoryItems.forEach(item => {
                        if (yPosition > pageHeight - 15) {
                            doc.addPage();
                            yPosition = 15;
                        }

                        const itemData = data.items[item.id];
                        doc.setTextColor(30, 41, 59);
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(8);
                        doc.text(item.name, 18, yPosition + 4);

                        const color = statusColors[itemData.status] || [0, 0, 0];
                        doc.setTextColor(color[0], color[1], color[2]);
                        doc.setFont('helvetica', 'bold');
                        doc.text(itemData.status, 110, yPosition + 4);

                        doc.setTextColor(100, 116, 139);
                        doc.setFont('helvetica', 'normal');
                        const obs = itemData.obs || '—';
                        const splitObs = doc.splitTextToSize(obs, 60);
                        doc.text(splitObs, 140, yPosition + 4);

                        const lines = splitObs.length;
                        yPosition += Math.max(6, lines * 4);

                        doc.setDrawColor(241, 245, 249);
                        doc.line(15, yPosition - 1, pageWidth - 15, yPosition - 1);
                    });
                    yPosition += 4;
                });

                if (yPosition > pageHeight - 50) {
                    doc.addPage();
                    yPosition = 15;
                }

                doc.setFillColor(254, 242, 242);
                doc.rect(15, yPosition, pageWidth - 30, 6, 'F');
                doc.setTextColor(153, 27, 27);
                doc.setFont('helvetica', 'bold');
                doc.text('RELATÓRIO DE PANES / FALHAS', 18, yPosition + 4);
                yPosition += 8;
                doc.setTextColor(51, 65, 85);
                doc.setFont('helvetica', 'normal');
                const panesText = doc.splitTextToSize(data.panes || 'Nenhuma pane relatada.', pageWidth - 40);
                doc.text(panesText, 20, yPosition);
                yPosition += (panesText.length * 5) + 10;

                doc.setFillColor(240, 253, 250);
                doc.rect(15, yPosition, pageWidth - 30, 6, 'F');
                doc.setTextColor(15, 118, 110);
                doc.setFont('helvetica', 'bold');
                doc.text('NECESSIDADES DE REPOSIÇÃO', 18, yPosition + 4);
                yPosition += 8;
                doc.setTextColor(51, 65, 85);
                doc.setFont('helvetica', 'normal');
                const reposicaoText = doc.splitTextToSize(data.reposicao || 'Nenhuma reposição necessária.', pageWidth - 40);
                doc.text(reposicaoText, 20, yPosition);
                yPosition += (reposicaoText.length * 5) + 20;

                if (yPosition > pageHeight - 40) {
                    doc.addPage();
                    yPosition = 30;
                }
                doc.setDrawColor(203, 213, 225);
                doc.line(20, yPosition, 90, yPosition);
                doc.text('Assinatura do Motorista', 55, yPosition + 5, { align: 'center' });
                doc.line(120, yPosition, 190, yPosition);
                doc.text('Assinatura do Inspetor', 155, yPosition + 5, { align: 'center' });

                doc.save(`Checklist_${data.cavaloMecanico || 'Viatura'}.pdf`);
                showToast('PDF gerado com sucesso!');
            } catch (error) {
                console.error(error);
                showToast('Erro ao gerar PDF', 'error');
            }
        }

        window.onload = () => {
            renderForm();
        };
    </script>
</body>
</html>
